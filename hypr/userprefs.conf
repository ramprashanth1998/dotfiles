# hidden 11th workspace (pinned to laptop in monitors.conf, hidden in waybar)
# grave/backtick key (`) = code:49
bind = $mainMod, code:49, workspace, 11
bind = $mainMod SHIFT, code:49, movetoworkspace, 11

# per-monitor waybar (hide laptop bar while HDMI-A-1 attached) runs as a
# systemd user service: waybar-per-monitor.service (WantedBy graphical-session)


# // █▀█ █▀█ ▄▀█ █▀▀ █ ▀█▀ █▄█
# // █▄█ █▀▀ █▀█ █▄▄ █ ░█░ ░█░

# disable transparency (force fully opaque) for zen + steam
# sourced after windowrules.conf, so these override HyDE's opacity rules
windowrule = opacity 1.00 $& 1.00 $& 1,match:class ^(zen)$
windowrule = opacity 1.00 $& 1.00 $& 1,match:class ^([Ss]team)$
windowrule = opacity 1.00 $& 1.00 $& 1,match:class ^(steamwebhelper)$


