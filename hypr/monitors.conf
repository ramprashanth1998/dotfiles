# Set your monitor configuration here
# See https://wiki.hypr.land/Configuring/Monitors/
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/monitors.t2

# name, resolution@refresh, position, scale
# Layout: [ external 1920w ][ laptop 1280w ]  (external is primary, left)
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1.0
monitor = eDP-1, 1920x1080@144, 1920x0, 1.5

# fallback for any other/unknown monitor
monitor = , preferred, auto, 1.0

# default workspaces 1-10 on primary external
workspace = 1,  monitor:HDMI-A-1, default:true
workspace = 2,  monitor:HDMI-A-1
workspace = 3,  monitor:HDMI-A-1
workspace = 4,  monitor:HDMI-A-1
workspace = 5,  monitor:HDMI-A-1
workspace = 6,  monitor:HDMI-A-1
workspace = 7,  monitor:HDMI-A-1
workspace = 8,  monitor:HDMI-A-1
workspace = 9,  monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# hidden 11th workspace pinned to laptop (hidden from waybar via ignore-workspaces)
workspace = 11, monitor:eDP-1
